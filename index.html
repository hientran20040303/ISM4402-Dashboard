<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tran Dashboard Final</title>
<style>
html,body{margin:0;padding:0;background:#EAEAEA}
.app{display:flex;min-height:100vh}
.nav{flex:0 0 220px;background:#1F4E79;color:#fff;position:sticky;top:0;height:100vh;box-sizing:border-box;padding:18px 0;display:flex;flex-direction:column;font-family:"Segoe UI",Arial,sans-serif}
.nav .brand{padding:0 18px 16px;font-family:'Times New Roman',serif;font-size:18px;font-weight:700;line-height:1.2;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:10px}
.nav .brand small{display:block;font-family:"Segoe UI",Arial,sans-serif;font-size:12px;font-weight:400;opacity:.75;margin-top:4px}
.nav a{display:flex;align-items:baseline;gap:8px;padding:10px 18px;color:rgba(255,255,255,.82);text-decoration:none;font-size:14px;border-left:4px solid transparent}
.nav a .k{font-size:11px;font-weight:700;opacity:.7;min-width:38px}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff;border-left-color:#F4A259;font-weight:600}
.nav a:focus-visible{outline:2px solid #F4A259;outline-offset:-2px}
.nav .pn{margin-top:auto;display:flex;gap:8px;padding:12px 18px 0;border-top:1px solid rgba(255,255,255,.18)}
.nav .pn button{flex:1;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:7px 0;font:inherit;font-size:13px;cursor:pointer}
.nav .pn button:hover:not(:disabled){background:rgba(255,255,255,.12)}
.nav .pn button:disabled{opacity:.35;cursor:default}
.main{flex:1;min-width:0;padding:16px}
@media (max-width:820px){
  .app{flex-direction:column}
  .nav{position:sticky;top:0;z-index:50;height:auto;flex:none;flex-direction:row;align-items:center;padding:0;overflow-x:auto}
  .nav .brand,.nav .pn{display:none}
  .nav a{border-left:0;border-bottom:3px solid transparent;padding:12px 14px;white-space:nowrap}
  .nav a[aria-current="page"]{border-bottom-color:#F4A259}
  .main{padding:8px}
}
body{font-family:"Segoe UI","Segoe UI Web",Tahoma,Arial,sans-serif;color:#252423}
#stage{margin:0 auto;position:relative}
.page{position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 1px #D0D0D0}
.vis{position:absolute;box-sizing:border-box;overflow:hidden}
.vis.bg{background:#FFFFFF}
.vtitle{font-family:DIN,"D-DIN","DIN Alternate","Segoe UI",Arial,sans-serif;color:#252423;white-space:normal;line-height:1.2}
.chartbox{position:absolute;left:0;right:0;bottom:0}
.vis.tb{overflow:visible}
.tb p{margin:0;line-height:1.15}
.tb ul,.tb ol{margin:0}
.tb li{line-height:1.15}
.card{display:flex;flex-direction:column}
.cval{font-family:"Segoe UI","Segoe UI Web",Arial,sans-serif;font-weight:600;line-height:1.1}
.clabel{color:#605E5C}
.cref{display:flex;justify-content:space-between;color:#605E5C;border-top:1px solid #E1DFDD}
.cref b{font-weight:600;color:#252423}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);height:100%}
.tile{display:flex;flex-direction:column;justify-content:center}
.sl-header{font-family:"Segoe UI Semibold","Segoe UI",Arial,sans-serif;font-weight:600;color:#252423}
.sl-select{width:100%;box-sizing:border-box;border:1px solid #C8C6C4;background:#fff;color:#252423;border-radius:2px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#605E5C 50%),linear-gradient(135deg,#605E5C 50%,transparent 50%);background-repeat:no-repeat;cursor:pointer}
.sl-tiles{display:flex;gap:0}
.sl-tiles button{flex:1;border:1px solid #C8C6C4;background:#fff;color:#252423;cursor:pointer;font-family:inherit}
.sl-tiles button+button{border-left:0}
.sl-tiles button[aria-pressed="true"]{background:#1F4E79;color:#fff;border-color:#1F4E79}
.sl-num{box-sizing:border-box;border:1px solid #C8C6C4;color:#252423;background:#fff}
.sl-range{width:100%;accent-color:#1F4E79;margin:0}
.navbtn{position:absolute;background:transparent;border:0;cursor:pointer;padding:0}
.navbtn:focus-visible,.sl-tiles button:focus-visible,.sl-select:focus-visible{outline:2px solid #1F4E79;outline-offset:1px}
table.pbit{border-collapse:collapse;width:100%;font-family:"Segoe UI",Arial,sans-serif;color:#252423}
.pbit th{text-align:left;font-weight:600;border-bottom:1px solid #1F4E79}
.pbit td{border-bottom:1px solid #EDEBE9}
.pbit th.n,.pbit td.n{text-align:right}
.pbit tr.tot td{font-weight:600;border-top:1px solid #1F4E79;border-bottom:0}
</style>
</head>
<body>
<div class="app">
<nav class="nav" aria-label="Dashboard pages">
  <div class="brand">USF Athletics Ticketing<small>GA Baseline vs Reserved seating</small></div>
  <a href="#overview" data-p="overview"><span class="k"></span>Overview</a>
  <a href="#kpi1" data-p="kpi1"><span class="k">KPI 1</span>Sell-Through</a>
  <a href="#kpi2" data-p="kpi2"><span class="k">KPI 2</span>RevPAS</a>
  <a href="#kpi3" data-p="kpi3"><span class="k">KPI 3</span>Occupancy</a>
  <a href="#kpi4" data-p="kpi4"><span class="k">KPI 4</span>Location Premium</a>
  <a href="#kpi5" data-p="kpi5"><span class="k">KPI 5</span>Price Realization</a>
  <div class="pn"><button type="button" id="prev" aria-label="Previous page">‹ Previous</button><button type="button" id="next" aria-label="Next page">Next ›</button></div>
</nav>
<div class="main"><div id="stage"></div></div>
</div>

    {label:'GA Conf Games',data:labs.map(x=>M.confGames(bySeason(x))),backgroundColor:THEME[0],fmtLabel:F.int},
    {label:'GA Conf Games at 50%+ of List',data:labs.map(x=>M.confGames50(bySeason(x))),backgroundColor:THEME[1],fmtLabel:F.int}]},
    options:{scales:{x:ax({title:'Season Label'}),y:ax({grid:true,beginAtZero:true,fmt:F.int,title:'GA Conf Games and GA Conf Games at 50%+ of List'})},plugins:{legend:legend(),valueLabels:{show:true},tooltip:tip({label:c=>`${c.dataset.label}: ${F.int(c.raw)}`})}}});
  // Average of GA Conf Realization, Show Realization Rank = 1, sorted desc
  const rows=bySeason(s).filter(r=>r.real!=null&&showRank('kpi5',r,'re')).sort((a,b)=>b.real-a.real);
  chart(chartVis(pg,0,359,610,360,'Conference games earning the most or least of list'),{type:'bar',data:{labels:rows.map(r=>r.key),datasets:[{label:'Average of GA Conf Realization',data:rows.map(r=>r.real),backgroundColor:THEME[0],fmtLabel:F.pct1}]},
    options:{indexAxis:'y',layout:{padding:{right:px(30)}},scales:{y:ax({}),x:ax({grid:true,beginAtZero:true,fmt:F.pct1})},plugins:{legend:{display:false},valueLabels:{show:true},tooltip:tip({label:c=>`Average of GA Conf Realization: ${F.pct1(c.raw)}`})}}});
  // Scatter: GA conference games, all seasons
  chart(chartVis(pg,610,359,669,360,'In 2025-26 the busiest games no longer earned more per ticket'),{type:'scatter',data:{datasets:SEASONS.map((x,i)=>({label:x,data:G.filter(r=>r.season===x&&isGA(r)&&isConf(r)).map(r=>({x:r.st,y:M.kpi5([r]),key:r.key})),backgroundColor:THEME[i],borderColor:THEME[i],pointRadius:px(4.5)}))},
    options:{scales:{x:ax({grid:true,fmt:F.gen,title:'GA sell-through'}),y:ax({grid:true,fmt:F.pct1,title:'Share of list earned'})},plugins:{legend:legend('Season Label'),tooltip:tip({label:c=>[`Game Key: ${c.raw.key}`,`Season Label: ${c.dataset.label}`,`Sum of Sell-Through: ${F.gen(c.raw.x)}`,`KPI5 GA Price Realization: ${F.pct1(c.raw.y)}`]})}}});
}

/* ---------- render & navigation ---------- */
const RENDER={overview,kpi1,kpi2,kpi3,kpi4,kpi5};
let cur='overview';
function render(){
  charts.splice(0).forEach(c=>c.destroy());
  const P=PAGE[cur],stage=document.getElementById('stage');
  const mainEl=document.querySelector('.main');const cs=getComputedStyle(mainEl);
  sc=Math.min(mainEl.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),1800)/P.w;
  document.querySelectorAll('.nav a').forEach(a=>{if(a.dataset.p===cur)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  const act=document.querySelector('.nav a[aria-current]');if(act&&window.innerWidth<=820)act.scrollIntoView({inline:'center',block:'nearest'});
  const order=Object.keys(RENDER),ix=order.indexOf(cur);
  const pv=document.getElementById('prev'),nx=document.getElementById('next');
  pv.disabled=ix===0;nx.disabled=ix===order.length-1;pv.onclick=()=>go(order[ix-1]);nx.onclick=()=>go(order[ix+1]);
  stage.innerHTML='';stage.style.width=P.w*sc+'px';
  const pg=document.createElement('div');pg.className='page';Object.assign(pg.style,{width:P.w*sc+'px',height:P.h*sc+'px',background:P.bg});
  stage.appendChild(pg);RENDER[cur](pg);
}
function go(p){if(location.hash.slice(1)!==p)location.hash=p;else{cur=p;render();}}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);cur=RENDER[h]?h:'overview';render();window.scrollTo(0,0);});
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const order=Object.keys(RENDER),ix=order.indexOf(cur);
  if(e.key==='ArrowRight'&&ix<order.length-1)go(order[ix+1]);if(e.key==='ArrowLeft'&&ix>0)go(order[ix-1]);});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,150);});
cur=RENDER[location.hash.slice(1)]?location.hash.slice(1):'overview';
render();
</script>
